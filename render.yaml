services:
  - type: web
    name: cemtn-backend
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
